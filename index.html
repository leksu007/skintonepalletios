<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ColorMatch">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <title>ColorMatch</title>
</head>
<body>

  <!-- Screen 1: Palette Selection -->
  <div id="screen-palette" class="screen active">
    <div class="container">
      <div class="header">
        <h1>ColorMatch</h1>
        <p class="subtitle">Find clothes that match your skin tone palette</p>
      </div>

      <div class="section">
        <label class="label" for="palette-select">Select your color season</label>
        <select id="palette-select">
          <option value="" disabled selected>Choose your palette...</option>
        </select>
      </div>

      <div class="checkbox-row">
        <label class="checkbox-label" for="default-check">
          <input type="checkbox" id="default-check">
          <span>Set as default palette</span>
        </label>
      </div>

      <div class="checkbox-row">
        <label class="checkbox-label" for="default-calib-check">
          <input type="checkbox" id="default-calib-check">
          <span>Use saved white balance calibration</span>
        </label>
        <span id="calib-status" class="calib-status">Not calibrated</span>
      </div>

      <div id="palette-preview" class="palette-preview hidden">
        <p class="palette-name" id="palette-name"></p>
        <p class="palette-desc" id="palette-desc"></p>
        <div class="color-swatches" id="palette-swatches"></div>
      </div>

      <button id="btn-start" class="btn btn-primary" disabled>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Open Camera
      </button>

      <button class="btn btn-exit exit-app-btn">Exit App</button>

      <div class="app-version">v1.7.0 — 2026-03-30</div>
    </div>
  </div>

  <!-- Screen 2: Camera -->
  <div id="screen-camera" class="screen">
    <div class="camera-wrapper">
      <video id="camera-feed" autoplay playsinline></video>
      <div class="camera-label-bar">
        <span id="calib-indicator" class="calib-indicator"></span>
      </div>
      <div class="camera-overlay">
        <div class="camera-guide">
          <span class="camera-guide-label">Place color here</span>
        </div>
      </div>
      <div class="camera-controls">
        <button id="btn-back" class="btn btn-circle btn-secondary" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <button id="btn-capture" class="btn btn-circle btn-capture" aria-label="Take Photo">
          <div class="capture-inner"></div>
        </button>
        <button id="btn-calibrate" class="btn btn-circle btn-secondary" aria-label="Calibrate White Balance" title="Hold white paper in the guide area, then tap to calibrate">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </div>
    <canvas id="capture-canvas" class="hidden"></canvas>
  </div>

  <!-- Screen 3: Color Correction -->
  <div id="screen-color-pick" class="screen">
    <div class="container">
      <div class="header">
        <h1>Adjust Color</h1>
        <p class="subtitle">Drag sliders until the color matches what you see</p>
      </div>

      <div class="color-preview-row">
        <div class="color-preview-box">
          <div class="color-preview-circle" id="original-color-preview"></div>
          <span class="color-preview-label">Camera</span>
        </div>
        <div class="color-preview-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
        <div class="color-preview-box">
          <div class="color-preview-circle" id="adjusted-color-preview"></div>
          <span class="color-preview-label">Adjusted</span>
        </div>
      </div>

      <div class="slider-group">
        <div class="slider-row">
          <label class="slider-label">
            <span class="slider-name">Temperature</span>
            <span class="slider-ends">Cool ↔ Warm</span>
          </label>
          <input type="range" id="slider-temp" class="color-slider slider-temp" min="-100" max="100" value="0">
        </div>
        <div class="slider-row">
          <label class="slider-label">
            <span class="slider-name">Lightness</span>
            <span class="slider-ends">Dark ↔ Light</span>
          </label>
          <input type="range" id="slider-light" class="color-slider slider-light" min="-100" max="100" value="0">
        </div>
        <div class="slider-row">
          <label class="slider-label">
            <span class="slider-name">Saturation</span>
            <span class="slider-ends">Muted ↔ Vivid</span>
          </label>
          <input type="range" id="slider-sat" class="color-slider slider-sat" min="-100" max="100" value="0">
        </div>
      </div>

      <div class="actions">
        <button id="btn-use-color" class="btn btn-primary">Analyze This Color</button>
        <button id="btn-reset-sliders" class="btn btn-secondary">Reset Sliders</button>
        <button id="btn-retake" class="btn btn-secondary">Retake Photo</button>
        <button id="btn-clear-calib" class="btn btn-secondary btn-calib-clear">Clear White Balance</button>
      </div>
    </div>
  </div>

  <!-- Screen 4: Results -->
  <div id="screen-results" class="screen">
    <div class="container">
      <div class="header">
        <h1>Results</h1>
      </div>

      <div id="overall-verdict" class="verdict-card">
        <div class="verdict-icon" id="verdict-icon"></div>
        <p class="verdict-text" id="verdict-text"></p>
        <p class="verdict-palette" id="verdict-palette"></p>
        <p class="verdict-feedback" id="verdict-feedback"></p>
        <div id="best-palettes" class="best-palettes"></div>
      </div>

      <div class="section">
        <h2>Dominant Color</h2>
        <div id="color-results" class="color-results"></div>
      </div>

      <div class="actions">
        <button id="btn-retry" class="btn btn-primary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          Try Again
        </button>
        <button id="btn-change-palette" class="btn btn-secondary">Change Palette</button>
        <button class="btn btn-exit exit-app-btn">Exit App</button>
      </div>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <p>Analyzing colors...</p>
  </div>

  <script src="js/palettes.js"></script>
  <script src="js/color-analysis.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
